syntax = "proto3";

import "google/protobuf/any.proto";

package nouto.test;

service TestService {
  rpc Echo (EchoRequest) returns (EchoResponse);
  rpc Count (CountRequest) returns (stream CountResponse);
  rpc WrapAny (AnyRequest) returns (AnyResponse);
  rpc Fail (EchoRequest) returns (EchoResponse);
  rpc Sum (stream SumRequest) returns (SumResponse);
  rpc Chat (stream ChatMessage) returns (stream ChatMessage);
  rpc FailStream (CountRequest) returns (stream CountResponse);
}

message EchoRequest {
  string message = 1;
  map<string, string> tags = 2;
}

message EchoResponse {
  string message = 1;
  map<string, string> tags = 2;
}

message CountRequest {
  int32 upTo = 1;
}

message CountResponse {
  int32 value = 1;
}

message AnyRequest {
  google.protobuf.Any payload = 1;
}

message AnyResponse {
  string typeUrl = 1;
  string label = 2;
}

message SumRequest {
  int32 value = 1;
}

message SumResponse {
  int32 total = 1;
  int32 count = 2;
}

message ChatMessage {
  string text = 1;
}
