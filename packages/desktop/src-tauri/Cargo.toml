[package]
name = "nouto"
version = "0.1.0"
description = "The fastest REST API client - pure Rust + Tauri"
authors = ["Nouto Contributors"]
license = "MIT"
repository = "https://github.com/nouto/nouto"
edition = "2021"

[lib]
name = "nouto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nouto"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2.0", features = ["image-png", "tray-icon"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
tauri-plugin-shell = "2.0"
tauri-plugin-opener = "2.0"
tauri-plugin-single-instance = "2.0"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
log = "0.4"
zip = "2"
serde = { version = "1.0", features = ["derive"] }
# preserve_order: keep response JSON keys in wire order so the explorer's
# "Sort keys alphabetically" toggle has a real original order to restore
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "1"

# HTTP stack (Phase 2)
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate", "zstd", "multipart", "stream", "rustls-tls", "socks", "blocking"], default-features = false }
hyper = "1.0"
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
http = "1.0"
tokio = { version = "1.40", features = ["full"] }

# Compression (Phase 2)
flate2 = "1.0"
brotli = "6.0"
zstd = "0.13"

# Font enumeration
font-loader = "0.11"

# Utilities
form_urlencoded = "1.2"
urlencoding = "2.1"
base64 = "0.22"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.0"
futures = "0.3"

# WebSocket (Phase 5)
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# gRPC stack
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
tonic-reflection = "0.12"
prost = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
protox = "0.7"
tokio-stream = "0.1"
async-stream = "0.3"

# Script engine (Phase 4)
rquickjs = { version = "0.9", features = ["full-async", "parallel"] }

# OS keychain (Windows Credential Manager, macOS Keychain, libsecret)
keyring = { version = "3", features = ["sync-secret-service"] }

# Data file parsing (Phase 14)
csv = "1.3"
calamine = "0.26"

# File system watcher (Phase 11)
notify = "7"
notify-debouncer-mini = "0.5"

# Digest auth (RFC 7616) + AWS SigV4 + NTLM
digest = "0.10"
md4 = "0.10"
md-5 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
regex = "1.10"
rand = "0.9"
serde_json_path = "0.7"
# draft202012 is NOT in the crate's default feature set — without it,
# Draft::Draft202012 does not exist and 3.1/3.2 meta-schemas would silently
# validate under Draft7. Default features (resolve-http/resolve-file/cli) are
# kept for services/assertions.rs.
jsonschema = { version = "0.17", features = ["draft202012"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-cli = "2.0"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Foundation",
] }

# panic = "abort" is deliberately not set: user scripts run through rquickjs
# inside tokio::task::spawn_blocking (services/script_engine.rs), and a panic
# there currently surfaces as a JoinError instead of taking the app down.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[lints.clippy]
# Tauri command handlers and request builders legitimately take many
# parameters / carry large payload variants; these lints are noise here.
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
