<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings — Nouto</title>
    <!--
      Paint hint: apply stored theme before bundles load to avoid a flash.
      Keep in sync with applyTheme() in packages/ui/src/stores/theme.svelte.ts.
    -->
    <script nonce="__TAURI_SCRIPT_NONCE__">
      (function () {
        try {
          var raw = localStorage.getItem('nouto_appearance');
          var theme = raw ? JSON.parse(raw).theme || 'system' : 'system';
          var root = document.documentElement;
          // Custom (engine) theme: the store cached its derived --hf-* map.
          var hintRaw = localStorage.getItem('nouto_paint_hint');
          var hint = hintRaw ? JSON.parse(hintRaw) : null;
          if (hint && hint.id === theme && hint.vars) {
            for (var name in hint.vars) root.style.setProperty(name, hint.vars[name]);
            root.setAttribute('data-theme', 'custom');
            root.setAttribute('data-theme-mode', hint.mode === 'light' ? 'light' : 'dark');
            return;
          }
          if (theme === 'system') {
            theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          root.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/settings-main.ts"></script>
  </body>
</html>
