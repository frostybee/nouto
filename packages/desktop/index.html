<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nouto</title>
    <!--
      Paint hint: resolve and apply the stored theme before bundles load so
      the window never flashes with the wrong background. Tauri injects a
      real nonce per inline script tag at serve time. Keep this resolution
      logic in sync with applyTheme() in packages/ui/src/stores/theme.svelte.ts.
    -->
    <script nonce="__TAURI_SCRIPT_NONCE__">
      (function () {
        try {
          var raw = localStorage.getItem('nouto_appearance');
          var theme = raw ? JSON.parse(raw).theme || 'system' : 'system';
          if (theme === 'system') {
            theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!--
      CSP nonce marker for the OpenAPI preview's sandboxed blob iframe. At serve
      time Tauri replaces the token with a per-launch nonce and appends it to the
      CSP's script-src; the blob frame inherits this document's CSP, so its inline
      scripts execute only when hostScriptNonce() can read a real nonce here.
      Blob-frame scripts are otherwise blocked by script-src 'self' (verified).
    -->
    <script nonce="__TAURI_SCRIPT_NONCE__"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
