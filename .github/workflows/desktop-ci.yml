name: Desktop CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/desktop/**'
      - 'packages/core/**'
      - 'packages/ui/**'
      - 'packages/transport/**'
      - 'pnpm-lock.yaml'
      - 'eslint.config.mjs'
      - '.prettierrc'
      - '.prettierignore'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/desktop/**'
      - 'packages/core/**'
      - 'packages/ui/**'
      - 'packages/transport/**'
      - 'pnpm-lock.yaml'
      - 'eslint.config.mjs'
      - '.prettierrc'
      - '.prettierignore'
      - '.github/workflows/desktop-ci.yml'

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, format, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version pin: action-setup reads packageManager from package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: knip (desktop)
        run: pnpm run knip

      - name: Build shared packages
        run: |
          pnpm run build:core
          pnpm run build:transport

      - name: Prettier
        run: pnpm run format:check

      - name: ESLint
        run: pnpm run lint

      - name: svelte-check (desktop)
        run: pnpm run check:desktop

      - name: svelte-check (ui)
        run: pnpm run check:ui

      - name: Desktop unit tests
        run: pnpm -F @nouto/desktop test

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # tauri::generate_context! embeds frontendDist (../dist) at compile
      # time and fails if the folder is missing. clippy/tests do not need the
      # real bundle, so a stub keeps this job independent of the JS toolchain.
      - name: Stub frontend dist
        shell: bash
        run: mkdir -p ../dist && echo '<!doctype html><title>stub</title>' > ../dist/index.html

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --lib
